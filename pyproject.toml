[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "inflow"
version = "1.0"
dependencies = [
  "numpy",
  "netCDF4",
  "gdal",
  "scipy",
  "shapely",
  "pyproj",
  "rtree",
]
authors = [
  { name="CHL HSB" },
]
description = "Tools to accumulate lateral inflow for streamflow modeling."
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]